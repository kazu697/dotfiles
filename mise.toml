# symlink-each だとファイル単位のリンクになり、アプリが生成するファイルがリポジトリに入らないため、従来どおりディレクトリ単位でリンクする
# .config/.claude は実行時ファイルが混ざるため対象外
[dotfiles]
"~/.config/direnv" = { source = ".config/direnv" }
"~/.config/ghostty" = { source = ".config/ghostty" }
"~/.config/lazygit" = { source = ".config/lazygit" }
"~/.config/mise" = { source = ".config/mise" }
"~/.config/nvim" = { source = ".config/nvim" }
"~/.config/sheldon" = { source = ".config/sheldon" }
"~/.config/starship.toml" = { source = ".config/starship.toml" }
"~/.config/tmux" = { source = ".config/tmux" }
"~/.config/yazi" = { source = ".config/yazi" }
"~/.config/zsh" = { source = ".config/zsh" }
"~/.gitconfig" = { source = "home/.gitconfig" }
"~/.zshenv" = { source = "home/.zshenv" }
"~/.zshrc" = { source = "home/.zshrc" }

[bootstrap.mise_shell_activate]
zsh = true

[tasks.link]
description = "指定ディレクトリ配下をシンボリックリンク"
usage = '''
arg "<src>" help="リンク元ディレクトリ（例: config/.claude）"
arg "<dest>" help="リンク先ディレクトリ（例: ~/.claude）"
'''
run = '''
#!/usr/bin/env bash
set -e
SRC="${usage_src}"
DEST="${usage_dest}"
DOTFILES_DIR="$(pwd)"

mkdir -p "$DEST"
for item in "$DOTFILES_DIR/$SRC"/*; do
  ln -fns "$item" "$DEST/$(basename "$item")"
done
echo "Linked $SRC -> $DEST"
'''

[tasks.setup]
description = "dotfilesをホームディレクトリにシンボリックリンク"
depends = ["setup:config", "setup:home"]

[tasks."setup:config"]
description = ".config/** -> ~/.config/**"
run = '''
#!/usr/bin/env bash
set -e
DOTFILES_DIR="$(pwd)"

mkdir -p ~/.config
for item in "$DOTFILES_DIR/.config"/*; do
  ln -fns "$item" ~/.config/"$(basename "$item")"
done
echo "Linked .config/** -> ~/.config/**"
'''

[tasks."setup:home"]
description = "home/** -> ~/**"
run = '''
#!/usr/bin/env bash
set -e
DOTFILES_DIR="$(pwd)"

for item in "$DOTFILES_DIR/home"/* "$DOTFILES_DIR/home"/.*; do
  [ -e "$item" ] || continue
  name="$(basename "$item")"
  [ "$name" = "." ] || [ "$name" = ".." ] && continue
  ln -fns "$item" ~/"$name"
done
echo "Linked home/** -> ~/**"
'''
